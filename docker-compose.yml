# ============================================
# Docker Compose 生产环境编排
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实值
#   2. docker-compose up -d
# ============================================

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: geo_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geo_hazard_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/geo_hazard_monitor_v1.1.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/upgrade:/docker-entrypoint-initdb.d/upgrade:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - geo_network

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: geo_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo_network

  # ---------- Spring Boot 后端 ----------
  spring-boot:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: geo_springboot
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geo_hazard_monitor}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MQTT_USERNAME: ${MQTT_USERNAME:-mica}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-mica}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m -Djava.awt.headless=true -Dfork=true}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - geo_network

  # ---------- Nginx 前端 ----------
  nginx:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: geo_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      - spring-boot
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - geo_network

# ---------- 数据卷 ----------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
  nginx_logs:
    driver: local

# ---------- 网络 ----------
networks:
  geo_network:
    driver: bridge
