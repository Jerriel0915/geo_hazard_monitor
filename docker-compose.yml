# ============================================
# Docker Compose 生产环境编排
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实值
#   2. docker compose up -d --build
# 设计原则：
#   - 仅暴露对外必要端口
#   - MySQL / Redis / IoTDB 仅容器内访问
#   - 启用日志轮转，避免日志占满磁盘
#   - 使用 unless-stopped，便于宿主机重启后自动恢复
# ============================================

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: geo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geo_hazard_monitor}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
      - --skip-name-resolve
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/geo_hazard_monitor_v1.10.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./db/upgrade:/docker-entrypoint-initdb.d/01-upgrade:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - geo_backend

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: geo_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --protected-mode
      - "yes"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - geo_backend

  # ---------- IoTDB 时序数据库 ----------
  # 使用 standalone 单节点镜像，JDBC 端口 6667，通过内置 CLI 探测就绪
  iotdb:
    image: apache/iotdb:2.0.2-standalone
    container_name: geo_iotdb
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    expose:
      - "6667"
    volumes:
      - iotdb_data:/iotdb/data
    healthcheck:
      test: [ "CMD-SHELL", "/iotdb/sbin/start-cli.sh -h 127.0.0.1 -p 6667 -u root -pw root -e 'show version' 2>/dev/null | grep -qi version || exit 1" ]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - geo_backend

  # ---------- Spring Boot 后端 ----------
  spring-boot:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: geo_springboot
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geo_hazard_monitor}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MQTT_USERNAME: ${MQTT_USERNAME:-mica}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-mica}
      IOTDB_ENABLED: ${IOTDB_ENABLED:-true}
      IOTDB_HOST: iotdb
      IOTDB_PORT: ${IOTDB_PORT:-6667}
      IOTDB_USERNAME: ${IOTDB_USERNAME:-root}
      IOTDB_PASSWORD: ${IOTDB_PASSWORD:-root}
      IOTDB_DATABASE: ${IOTDB_DATABASE:-root.geo_hazard}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m -Djava.awt.headless=true -Dfork=true}
      TZ: Asia/Shanghai
    expose:
      - "8080"
    ports:
      # 仅保留业务需要对外暴露的 MQTT 端口
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${MQTT_HTTP_PORT:-18083}:18083"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      iotdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - geo_backend

  # ---------- Nginx 前端 ----------
  nginx:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: geo_nginx
    restart: unless-stopped
    init: true
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    # 未挂载证书前不直接暴露 443，避免形成“端口已开但未启用 TLS”的伪 HTTPS。
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      spring-boot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - geo_backend

# ---------- 数据卷 ----------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  iotdb_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
  nginx_logs:
    driver: local

# ---------- 网络 ----------
networks:
  geo_backend:
    driver: bridge
