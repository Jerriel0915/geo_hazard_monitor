# 项目相关配置
zwei:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/zwei/uploadPath，Linux配置 /home/zwei/uploadPath）
  profile: D:/zwei/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  log:
    # 运行日志持久化级别，支持按需配置 INFO/WARN/ERROR
    runtime-levels:
      - WARN
      - ERROR
    # 兼容旧开关：开启后会额外采集 INFO 级运行日志
    runtime-info-enabled: false
    # SSE连接超时时间
    sse-timeout-ms: 300000
    # SSE重连建议时间
    sse-retry-ms: 3000
    # SSE断点最小落库间隔，单位毫秒；0表示每条事件都立即落库
    sse-checkpoint-flush-interval-ms: 5000
    # 普通日志保留天数
    cleanup-retention-days: 30
    # SSE断点保留天数
    cleanup-checkpoint-retention-days: 30
    # 单次清理批次大小
    cleanup-batch-size: 1000
  report:
    schedule:
      enabled: true              # 全局开关
      weekly-enabled: true       # 周报 Job
      monthly-enabled: true      # 月报 Job
      quarterly-enabled: true    # 季报 Job

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.zwei: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 100MB
      # 设置总上传的文件大小
      max-request-size: 100MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6378
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# IoT缓存预热配置
iot:
  cache:
    warmup:
      # 是否启用缓存预热（默认true）
      enabled: true
      # 预热线程池大小（默认4）
      thread-size: 4
  # 监测数据 Redis Stream 接入配置，用于支撑 MQTT 报文缓冲、去重与异步写入 IoTDB。
  monitor-ingest:
    enabled: true
    stream-key: stream:monitor:ingest
    dead-letter-stream-key: stream:monitor:dlq
    consumer-group: monitor-ingest-group
    consumer-name: admin-node
    dedupe-key-prefix: "monitor:dedupe:"
    dedupe-ttl-seconds: 86400
    poll-batch-size: 20
    poll-block-ms: 2000
    retry-delays-seconds:
      - 5
      - 30
      - 120
  # 新增 IoTDB 基础连接参数，用于工业监测数据的时序化落库与查询。
  iotdb:
    enabled: true
    host: localhost
    port: 6667
    username: root
    password: root
    database: root.geo_hazard
    connection-timeout-ms: 5000
    query-timeout-seconds: 30
    fetch-size: 500

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.zwei.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.zwei.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,zwei.vip,www.zwei.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# MQTT Broker配置
# mqtt 服务端配置
mqtt:
  server:
    enabled: true               # 是否开启服务端，默认：true
    name: Mica-Mqtt-Server      # 名称，默认：Mica-Mqtt-Server
    heartbeat-timeout: 120000   # 心跳超时，单位毫秒，默认: 1000 * 120
    read-buffer-size: 8KB       # 接收数据的 buffer size，默认：8k
    max-bytes-in-message: 10MB  # 消息解析最大 bytes 长度，默认：10M
    auth:
      enable: true              # 是否开启 mqtt 认证
      username: mica            # mqtt 认证用户名
      password: mica            # mqtt 认证密码
    debug: true                 # 如果开启 prometheus 指标收集建议关闭
    stat-enable: true           # 开启指标收集，debug 和 prometheus 开启时需要打开，默认开启，关闭节省内存
    mqtt-listener: # mqtt 监听器
      enable: true              # 是否开启，默认：false
      #      ip: "0.0.0.0"            # 服务端 ip 默认为空，0.0.0.0，建议不要设置
      port: 1883                # 端口，默认：1883
    mqtt-ssl-listener: # mqtt ssl 监听器
      enable: false             # 是否开启，默认：false
      port: 8883                # 端口，默认：8883
      ssl: # ssl 配置，必须
        keystore-path:          # 必须参数：ssl keystore 目录，支持 classpath:/ 路径。
        keystore-pass:          # 必选参数：ssl keystore 密码
        truststore-path:        # 可选参数：ssl 双向认证 truststore 目录，支持 classpath:/ 路径。
        truststore-pass:        # 可选参数：ssl 双向认证 truststore 密码
        client-auth: none       # 是否需要客户端认证（双向认证），默认：NONE（不需要）
    ws-listener: # websocket mqtt 监听器
      enable: true              # 是否开启，默认：false
      port: 8083                # websocket 端口，默认：8083
    wss-listener: # websocket ssl mqtt 监听器
      enable: false             # 是否开启，默认：false
      port: 8084                # 端口，默认：8084
      ssl: # ssl 配置，必须
        keystore-path:          # 必须参数：ssl keystore 目录，支持 classpath:/ 路径。
        keystore-pass:          # 必选参数：ssl keystore 密码
        truststore-path:        # 可选参数：ssl 双向认证 truststore 目录，支持 classpath:/ 路径。
        truststore-pass:        # 可选参数：ssl 双向认证 truststore 密码
        client-auth: none       # 是否需要客户端认证（双向认证），默认：NONE（不需要）
    http-listener:
      enable: true
      port: 18083
      basic-auth: # 基础认证
        enable: true
        username: mica
        password: mica
    mcp-server: # 大模型 mcp
      enable: true

# 设备认证中心配置
  auth-center:
    # 是否强制校验设备协议类型必须为 MQTT；关闭后兼容历史设备资料未维护协议类型的场景。默认为 false
    enforce-mqtt-protocol: false
    # 单个设备账号连续失败达到阈值后进入临时封禁，降低暴力重试对 Broker 的冲击。
    failure-threshold: 5
    # 账号被封禁后的冷却时间，单位秒。
    ban-duration-seconds: 600
    # 开启后同一设备只允许保留一个活跃连接，后登录连接会挤掉前一个连接。
    disconnect-previous-client: true
